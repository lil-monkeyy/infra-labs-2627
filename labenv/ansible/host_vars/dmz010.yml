firewall_services: 
  - https
  - http
  - dns

nginx_vhosts:
  - listen: "443 ssl http2"
    server_name: "www.infra.lan"
    root: "/var/www/html"
    index: "index.nginx-debian.html"
    state: "present"
    template: "{{ nginx_vhost_template }}"
    filename: "example.com.conf"
    extra_parameters: |
      ssl_certificate     /etc/ssl/certs/dmz010.crt;
      ssl_certificate_key /etc/ssl/private/dmz010.key;
      ssl_protocols       TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;