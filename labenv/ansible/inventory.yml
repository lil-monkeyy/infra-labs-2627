# ansible/inventory.yml -- host inventory
---

all:
  vars:
    ansible_user: vagrant
    ansible_ssh_password: vagrant
    ansible_ssh_host_key_checking: false
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: true
  children:
    infra_hosts:
      hosts:
        infra010:
          ansible_host: 172.16.0.10

