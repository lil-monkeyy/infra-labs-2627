tool:
  dotNetConfiguration:
    buildAllowed: true
    cleanAllowed: true
    listPackageAllowed: true
    nuGetDeleteAllowed: true
    nuGetLocalsAllowed: true
    nuGetPushAllowed: true
    packAllowed: true
    publishAllowed: true
    restoreAllowed: true
    telemetryOptOut: true
    testAllowed: true
    toolRestoreAllowed: true
  dotnetsdk:
    installations:
    - name: "dotnet-10"
      properties:
      - installSource:
          installers:
          - installDotNetSDK:
              release: "10.0.12"
              sdk: "10.0.401"
              url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz"
              version: ".NET 10.0"
  git:
    installations:
    - home: "git"
      name: "Default"
  mavenGlobalConfig:
    globalSettingsProvider: "standard"
    settingsProvider: "standard"
jobs:
  - script: |
      pipelineJob('BuildDotNet-demo') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/lil-monkeyy/dotnet-demo-app.git')
                  credentials('5a6a802e-3a3f-46df-afd2-6fd471788307')
                }
                branch('*/main')
              }
            }
            scriptPath('dotNetJenkinsfile')
          }
        }
      }
      job('BuildSampleApp') {
        scm {
          git {
            remote {
              url('https://github.com/lil-monkeyy/cicd-sample-app-.git')
            }
            branch('*/main')
          }
        }
        steps {
          shell('bash ./cicd-sample-app/sample-app.sh')
        }
      }
      job('TestSampleApp') {
        scm {
          git {
            remote {
              url('https://github.com/lil-monkeyy/cicd-sample-app-.git')
            }
            branch('*/main')
          }
        }
        triggers {
          upstream('TestSampleApp', 'SUCCESS')
        }
        steps {
          shell('curl http://172.17.0.1:5050/ | grep "You are calling me from 172.17.0.1"')
        }
      }    
      
