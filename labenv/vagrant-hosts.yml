# vagrant_hosts.yml
#
# List of hosts to be created by Vagrant. For more information about the
# possible settings, see the documentation at
# <https://github.com/bertvv/vagrant-shell-skeleton>
---

# Will host the Jenkins build server deployed as a Docker container
- name: infra010
  box: bento/debian-13
  ip: 172.16.0.10
  netmask: 255.255.0.0

# Control node - has Ansible installed. From this VM, you control the
#  configuration of the entire lab environment
- name: control
  box: bento/almalinux-10
  ip: 172.16.0.2
  netmask: 255.255.0.0

